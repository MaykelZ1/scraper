services:
  - type: web
    name: allpeliculas-scraper
    env: node
    # Instala dependencias + navegador de Playwright en el build
    buildCommand: npm install && npx playwright install chromium
    # Inicia el servicio
    startCommand: node server.js
    # Plan gratuito de Render es suficiente
    plan: free
    # Variables de entorno (no requieren cambios)
    envVars:
      - key: NODE_ENV
        value: production
      # Ruta donde Render guarda el navegador de Playwright
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/.cache/ms-playwright
