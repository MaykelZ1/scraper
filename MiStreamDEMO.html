<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiStream — Professional Streaming</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
:root {
    /* Color Palette - Deep & Professional */
    --bg-primary: #050508;
    --bg-secondary: #0a0a0f;
    --bg-accent: #11111a;
    
    --text-primary: #ffffff;
    --text-secondary: #8a8a98;
    --text-muted: #52525b;
    
    /* Category Colors - More Sophisticated */
    --color-movies: #0ea5e9;
    --color-series: #6366f1;
    --color-anime: #a855f7;
    --color-doramas: #ec4899;
    
    /* Dynamic Accent */
    --accent: var(--color-movies);
    --accent-rgb: 14, 165, 233;
    
    /* Glassmorphism */
    --glass-bg: rgba(255, 255, 255, 0.03);
    --glass-border: rgba(255, 255, 255, 0.06);
    --glass-hover: rgba(255, 255, 255, 0.08);
    
    /* Layout */
    --sidebar-w: 280px;
    --header-h: 70px;
    --radius-lg: 20px;
    --radius-md: 12px;
    
    /* Transitions */
    --transition-base: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

[data-theme="light"] {
    --bg-primary: #fcfcfd;
    --bg-secondary: #f4f4f7;
    --bg-accent: #ebecef;
    --text-primary: #09090b;
    --text-secondary: #71717a;
    --text-muted: #a1a1aa;
    --glass-bg: rgba(0, 0, 0, 0.02);
    --glass-border: rgba(0, 0, 0, 0.08);
    --glass-hover: rgba(0, 0, 0, 0.05);
}

/* Category Scopes */
.cat-movies { --accent: var(--color-movies); --accent-rgb: 14, 165, 233; }
.cat-series { --accent: var(--color-series); --accent-rgb: 99, 102, 241; }
.cat-anime { --accent: var(--color-anime); --accent-rgb: 168, 85, 247; }
.cat-doramas { --accent: var(--color-doramas); --accent-rgb: 236, 72, 153; }

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
}

/* --- SVG ICONS --- */
.icon {
    width: 20px;
    height: 20px;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}

/* --- LAYOUT STRUCTURE --- */
.app-container {
    display: flex;
    min-height: 100vh;
}

/* --- SIDEBAR --- */
.sidebar {
    width: var(--sidebar-w);
    height: 100vh;
    position: fixed;
    left: 0;
    top: 0;
    background: var(--bg-secondary);
    border-right: 1px solid var(--glass-border);
    display: flex;
    flex-direction: column;
    z-index: 100;
    transition: transform var(--transition-base);
}

.sidebar-brand {
    padding: 32px 24px;
    font-family: 'Poppins', sans-serif;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.03em;
    display: flex;
    align-items: center;
    gap: 12px;
}

.brand-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 15px var(--accent);
}

.sidebar-nav {
    flex: 1;
    padding: 0 16px;
    overflow-y: auto;
}

.nav-group {
    margin-bottom: 32px;
}

.nav-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-muted);
    padding: 0 12px 12px;
}

.nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
    border-radius: var(--radius-md);
    color: var(--text-secondary);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    transition: all 0.2s;
    cursor: pointer;
    margin-bottom: 4px;
}

.nav-item:hover {
    background: var(--glass-bg);
    color: var(--text-primary);
}

.nav-item.active {
    background: rgba(var(--accent-rgb), 0.1);
    color: var(--accent);
}

/* --- MAIN CONTENT --- */
.main-wrapper {
    flex: 1;
    margin-left: var(--sidebar-w);
    display: flex;
    flex-direction: column;
}

.top-bar {
    height: var(--header-h);
    padding: 0 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(var(--bg-primary), 0.8);
    backdrop-filter: blur(10px);
    position: sticky;
    top: 0;
    z-index: 90;
    border-bottom: 1px solid var(--glass-border);
}

.search-bar {
    max-width: 400px;
    width: 100%;
    position: relative;
}

.search-bar input {
    width: 100%;
    background: var(--bg-accent);
    border: 1px solid var(--glass-border);
    padding: 10px 16px 10px 44px;
    border-radius: 100px;
    color: var(--text-primary);
    outline: none;
    font-size: 14px;
    transition: border-color 0.2s;
}

.search-bar input:focus {
    border-color: var(--accent);
}

.search-bar .icon {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    width: 20px;
    height: 20px;
    pointer-events: none;
}

/* --- CONTENT SECTIONS --- */
.content-area {
    padding: 40px;
}

/* --- GRID SYSTEM --- */
.section-title {
    font-family: 'Poppins', sans-serif;
    font-size: 28px;
    margin-bottom: 32px;
    display: flex;
    align-items: center;
    gap: 16px;
    letter-spacing: -0.03em;
}


.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 24px;
}

.genre-row-section {
    margin-bottom: 34px;
}

.row-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 18px;
}

.row-title {
    font-size: 20px;
    font-weight: 700;
}

.ver-todos {
    border: 1px solid var(--glass-border);
    background: var(--bg-accent);
    color: var(--text-secondary);
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
}

.ver-todos:hover {
    background: var(--glass-hover);
    color: var(--text-primary);
}

.genre-row {
    display: flex;
    gap: 18px;
    overflow-x: auto;
    padding-bottom: 8px;
}

.genre-row::-webkit-scrollbar {
    display: none;
}

.genre-row .card {
    min-width: 180px;
    flex: 0 0 180px;
}

.empty-row {
    color: var(--text-secondary);
    padding: 24px 0;
}

.settings-gear {
    display: none;
}

#settingsModalOverlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.65);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 130;
    padding: 24px;
}

#settingsModalOverlay.visible {
    display: flex;
}

.settings-modal {
    width: min(520px, 100%);
    background: var(--bg-secondary);
    border: 1px solid var(--glass-border);
    border-radius: 24px;
    padding: 28px;
    box-shadow: 0 35px 70px rgba(0,0,0,0.35);
}

.settings-modal h2 {
    margin-bottom: 18px;
    font-size: 22px;
}

.settings-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin: 24px 0;
}

.settings-row p {
    color: var(--text-secondary);
    line-height: 1.6;
    max-width: 320px;
}

.toggle-switch {
    position: relative;
    width: 58px;
    height: 34px;
}

.toggle-switch input {
    opacity: 0;
    width: 0;
    height: 0;
}

.toggle-slider {
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,0.08);
    border-radius: 999px;
    transition: background 0.2s ease;
}

.toggle-slider::before {
    content: '';
    position: absolute;
    left: 6px;
    top: 6px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--bg-primary);
    transition: transform 0.2s ease;
}

.toggle-switch input:checked + .toggle-slider {
    background: rgba(var(--accent-rgb), 0.35);
}

.toggle-switch input:checked + .toggle-slider::before {
    transform: translateX(24px);
}

.settings-footer {
    display: flex;
    justify-content: flex-end;
    gap: 12px;
    margin-top: 18px;
}

.settings-btn {
    border: 1px solid var(--glass-border);
    background: var(--bg-accent);
    color: var(--text-secondary);
    padding: 10px 18px;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.2s ease;
}

.settings-btn:hover {
    background: var(--glass-hover);
    color: var(--text-primary);
}

@media (max-width: 1024px) {
    .settings-gear { left: 24px; }
}

/* Floating settings button (desktop) */
.settings-gear-floating {
    position: fixed;
    left: 12px;
    bottom: 12px;
    min-width: 170px;
    height: 46px;
    border-radius: 999px;
    background: var(--bg-secondary);
    border: 1px solid var(--glass-border);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 0 14px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.45);
    z-index: 140;
    color: var(--text-secondary);
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease;
}
.settings-gear-floating:hover { transform: translateY(-4px); background: var(--glass-hover); }
.settings-gear-floating .icon { width: 18px; height: 18px; color: var(--text-secondary); }
.settings-gear-floating span { font-size: 14px; font-weight: 600; color: var(--text-secondary); }
.settings-gear-floating svg { stroke: currentColor; fill: none; }

/* Hide the sidebar settings link on desktop, keep it visible on small screens */
.settings-nav { display: none; }
@media (max-width: 1024px) { .settings-nav { display: flex; } }

/* Compact modal */
.settings-modal {
    width: min(520px, 100%);
    background: var(--bg-secondary);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    padding: 18px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.45);
    max-height: 80vh;
    overflow-y: auto;
}
.settings-modal h2 { margin-bottom: 12px; font-size: 18px; }
.settings-row { margin: 14px 0; }
.settings-row p { color: var(--text-secondary); line-height: 1.4; max-width: 300px; font-size: 13px; }
.toggle-switch { width: 46px; height: 28px; }
.toggle-slider::before { left: 5px; top: 4px; width: 18px; height: 18px; }
.toggle-switch input:checked + .toggle-slider::before { transform: translateX(18px); }
.settings-footer { margin-top: 12px; }
.settings-btn { padding: 8px 14px; }
.settings-status { color: var(--text-secondary); font-size: 13px; }

/* --- CARDS --- */
.card {
    background: var(--bg-secondary);
    border-radius: var(--radius-md);
    overflow: hidden;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.5s, border-color 0.2s;
    cursor: pointer;
    border: 1px solid var(--glass-border);
    opacity: 0;
}

.card.visible {
    opacity: 1;
}

.card:hover {
    transform: translateY(-10px);
    border-color: var(--accent);
}

/* --- SPINNER --- */
.spinner {
    width: 24px;
    height: 24px;
    border: 2px solid var(--glass-border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.card-media {
    aspect-ratio: 2/3;
    position: relative;
    overflow: hidden;
}

.card-media img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.5s;
}

.card:hover .card-media img {
    transform: scale(1.1);
}

.card-badge {
    position: absolute;
    top: 12px;
    right: 12px;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(4px);
    padding: 4px 8px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 700;
    color: var(--accent);
    border: 1px solid rgba(var(--accent-rgb), 0.3);
}

.card-info {
    padding: 16px;
}

.card-title {
    font-family: 'Poppins', sans-serif;
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.card-meta {
    font-size: 12px;
    color: var(--text-secondary);
}

/* --- DETAIL VIEW --- */
.detail-view {
    position: relative;
}

.detail-view .back-btn {
    position: absolute;
    top: 24px;
    left: 24px;
    z-index: 100; /* Asegurar que esté por encima de todo */
    margin-bottom: 0;
}

.detail-hero {
    height: 50vh;
    position: relative;
    margin: -40px -40px 0;
    overflow: hidden;
}

.detail-hero-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: brightness(0.4);
}

.detail-hero-content {
    position: absolute;
    bottom: 0;
    left: 0;
    padding: 60px 40px;
    width: 100%;
    background: linear-gradient(to top, var(--bg-primary) 0%, transparent 100%);
}

.detail-title {
    font-family: 'Poppins', sans-serif;
    font-size: 48px;
    font-weight: 700;
    margin-bottom: 16px;
    letter-spacing: -0.04em;
}

.detail-meta-row {
    display: flex;
    gap: 16px;
    margin-bottom: 24px;
}

.meta-item {
    background: var(--glass-bg);
    padding: 6px 16px;
    border-radius: 100px;
    font-size: 13px;
    border: 1px solid var(--glass-border);
}

.detail-grid {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 40px;
    margin-top: 40px;
}

.player-wrapper {
    background: #000;
    aspect-ratio: 16/9;
    border-radius: var(--radius-lg);
    overflow: hidden;
    border: 1px solid var(--glass-border);
    box-shadow: 0 20px 40px rgba(0,0,0,0.5);
}

.player-wrapper iframe {
    width: 100%;
    height: 100%;
    border: none;
}

.detail-sidebar {
    display: flex;
    flex-direction: column;
    gap: 24px;
}

.sidebar-box {
    background: var(--bg-secondary);
    padding: 24px;
    border-radius: var(--radius-md);
    border: 1px solid var(--glass-border);
}

.box-title {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 16px;
    color: var(--text-primary);
}

/* --- EPISODES LIST --- */
.ep-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(50px, 1fr));
    gap: 8px;
}

.ep-btn {
    background: var(--bg-accent);
    border: 1px solid var(--glass-border);
    color: var(--text-secondary);
    padding: 10px 5px;
    border-radius: 8px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 13px;
    font-weight: 600;
}

.ep-btn:hover {
    border-color: var(--accent);
    color: var(--text-primary);
}

.ep-btn.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
}

.server-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.server-btn {
    background: var(--bg-accent);
    border: 1px solid var(--glass-border);
    color: var(--text-secondary);
    padding: 12px;
    border-radius: 8px;
    text-align: left;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 14px;
}

.server-btn:hover {
    border-color: var(--accent);
    color: var(--text-primary);
}

.server-btn.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
}

/* --- UTILS --- */
.back-btn {
    background: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(10px);
    border: 1px solid var(--glass-border);
    color: var(--text-primary);
    padding: 10px 20px;
    border-radius: 100px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 600;
    transition: all 0.3s;
    width: fit-content;
}

.back-btn:hover {
    background: var(--accent);
    transform: translateX(-5px);
    border-color: var(--accent);
}

/* --- SKELETON LOADING --- */
.skeleton {
    background: linear-gradient(90deg, var(--bg-accent) 25%, var(--bg-secondary) 50%, var(--bg-accent) 75%);
    background-size: 200% 100%;
    animation: loading 1.5s infinite;
}

@keyframes loading {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
}

/* Responsive */
@media (max-width: 1024px) {
    .sidebar { transform: translateX(-100%); }
    .main-wrapper { margin-left: 0; }
    .detail-grid { grid-template-columns: 1fr; }
}
    </style>
</head>
<body>
    <div class="app-container">
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <div class="brand-dot"></div>
                MiStream
            </div>

            <nav class="sidebar-nav">
                <div class="nav-group">
                    <div class="nav-label">Explorar</div>
                    <a class="nav-item active" data-type="all" onclick="setFilter('all')">
                        <svg class="icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                        Inicio
                    </a>
                    <a class="nav-item" data-type="movie" onclick="setFilter('movie')">
                        <svg class="icon" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect><line x1="7" y1="2" x2="7" y2="22"></line><line x1="17" y1="2" x2="17" y2="22"></line><line x1="2" y1="12" x2="22" y2="12"></line><line x1="2" y1="7" x2="7" y2="7"></line><line x1="2" y1="17" x2="7" y2="17"></line><line x1="17" y1="17" x2="22" y2="17"></line><line x1="17" y1="7" x2="22" y2="7"></line></svg>
                        Películas
                    </a>
                    <a class="nav-item" data-type="tv" onclick="setFilter('tv')">
                        <svg class="icon" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="15" rx="2" ry="2"></rect><polyline points="17 2 12 7 7 2"></polyline></svg>
                        Series
                    </a>
                    <a class="nav-item" data-type="anime" onclick="setFilter('anime')">
                        <svg class="icon" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
                        Anime
                    </a>
                    <a class="nav-item" data-type="dorama" onclick="setFilter('dorama')">
                        <svg class="icon" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"></path></svg>
                        Doramas
                    </a>
                </div>
                <div class="nav-group" style="margin-top: auto; border-top: 1px solid var(--glass-border); padding-top: 16px;">
                    <a class="nav-item settings-nav" onclick="openSettingsModal()" style="justify-content: center;">
                        <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06A2 2 0 112.31 17.38l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82l-.06-.06A2 2 0 114.36 3.69l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V1a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06A2 2 0 1119.69 6.62l-.06.06a1.65 1.65 0 00-.33 1.82 1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"></path></svg>
                        Configuración
                    </a>
                </div>
            </nav>
        </aside>

        <!-- MAIN WRAPPER -->
        <div class="main-wrapper">
            <header class="top-bar">
                <div class="search-bar">
                    <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="text" id="searchInput" placeholder="Buscar títulos, géneros...">
                </div>
            </header>

            <main id="mainContent">
                <!-- Content will be injected by JavaScript -->
            </main>
        </div>



        <div id="settingsModalOverlay" onclick="if (event.target.id === 'settingsModalOverlay') closeSettingsModal();">
            <div class="settings-modal">
                <h2>Configuración</h2>
                <div class="settings-row">

function isContentAllowed(item) {
    // Si es contenido adulto marcado explícitamente en TMDB
    if (item.adult === true) return state.sensitiveAllowed;
    
    // Si sensitive content está desactivado, filtrar agresivamente
    if (!state.sensitiveAllowed) {
        const title = (item.title || item.name || '').toLowerCase().trim();
        const originalTitle = (item.original_title || item.original_name || '').toLowerCase().trim();
        const overview = (item.overview || '').toLowerCase().trim();
        
        // Combinar textos para búsqueda única
        const fullText = `${title} ${originalTitle} ${overview}`;
        
        // Filtrar por palabras clave
        for (let keyword of ADULT_KEYWORDS) {
            if (fullText.includes(keyword.toLowerCase())) {
                return false;
            }
        }

        // Filtrar patrones específicos como "+18", "18+", "r18", "r-18"
        if (/\b(18\+|r18|r-18|\+18|adulto|hentai|sexo|h-anime|ecchi|uncensored|sin censura)\b/i.test(fullText)) {
            return false;
        }

        // Bloqueo específico por palabras que suelen ir juntas en contenido adulto
        if (title.includes('h-') || title.includes('-h') || title.includes(' r18')) {
            return false;
        }

        // Casos específicos de anime adulto popular (Overflow, etc)
        if (item.original_language === 'ja') {
            const forbiddenAnime = ['overflow', 'kiss x sis', 'aki-sora', 'ramune', 'euphoria', 'boku no pico'];
            if (forbiddenAnime.some(name => title.includes(name) || originalTitle.includes(name))) {
                return false;
            }
        }
        
        // Filtrar anime con características sospechosas (títulos muy cortos con números/símbolos raros)
        // Muchos hentais tienen títulos como "A-1" o "OVA 1" etc.
        if (item.original_language === 'ja' && title.length < 5 && /[\d\[\](){}]/.test(title)) {
            return false;
        }
        
        // Patrones de títulos típicos de contenido erótico/hentai corto (solo para contenido japonés/anime)
        if (item.original_language === 'ja' && (/^[^a-z]*\d{1,4}$|OVA|ova|especial|special|bonus|part \d/i.test(title))) {
            const shortTitle = title.replace(/[^a-z]/g, '');
            // Solo filtrar si el título es extremadamente corto (ej: OVA 1)
            if (shortTitle.length > 0 && shortTitle.length < 3) return false;
        }

        // Filtro adicional para títulos que contienen sólo caracteres no alfanuméricos y números
        if (title.length > 0 && /^[\d\W_]+$/.test(title)) {
            return false;
        }

        // Bloquear títulos que contengan "uncensored" o "sin censura" en cualquier idioma
        if (fullText.includes('uncensored') || fullText.includes('sin censura') || fullText.includes('sin-censura')) {
            return false;
        }
    }
    
    return true;
}

/* --- FETCH ENGINE --- */
async function apiCall(endpoint, params = {}) {
    const url = new URL(`${TMDB_BASE_URL}${endpoint}`);
    url.searchParams.append('api_key', TMDB_API_KEY);
    url.searchParams.append('language', 'es-MX'); // Cambiado a Latino
    
    if (params.include_adult === undefined) {
        params.include_adult = state.sensitiveAllowed ? 'true' : 'false';
    }

    // Si sensitive está desactivado, asegurar que se excluyan palabras clave adultas en todas las llamadas
    if (!state.sensitiveAllowed && !params.without_keywords) {
        // IDs de palabras clave adultas en TMDB
        params.without_keywords = '179408,180547,9715,9799,156108,258212,180548,10753,202636,207395,207405,207406';
    }
    
    Object.keys(params).forEach(key => url.searchParams.append(key, params[key]));
    
    try {
        const response = await fetch(url.toString());
        if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
        return await response.json();
    } catch (e) {
        console.error('Fetch Failed:', e);
        return null;
    }
}

async function loadContent(reset = false, preserveScroll = true) {
    if (state.loading) return;

    // Si no es reset y no hay más contenido, salir
    if (!reset && !state.hasMore) return;

    state.loading = true;

    if (reset) {
        state.page = 1;
        state.content = [];
        state.hasMore = true;
        state.error = false;
        if (!preserveScroll) window.scrollTo(0, 0);
        renderHomeFrame();
        if (window.refreshObserver) window.refreshObserver();
    }

    // Filas por género (sin paginación)
    if (state.filter !== 'all' && !state.selectedGenre && !state.search) {
        await loadGenreRows();
        state.loading = false;
        state.hasMore = false;
        updateInfiniteScrollTrigger();
        if (window.refreshObserver) window.refreshObserver();
        return;
    }

    toggleSkeletons(true);

    let data = null;
    const p = { page: state.page };

    try {
        if (state.search) {
            data = await apiCall('/search/multi', { ...p, query: state.search });
        } else if (state.selectedGenre && state.filter !== 'all') {
            const params = getCategoryParams({ ...p, with_genres: state.selectedGenre });
            if (state.selectedGenre === 27 && state.filter !== 'movie') {
                if (state.filter === 'anime') params.with_genres = '16';
                else delete params.with_genres;
                params.with_keywords = '6186|12988|9748|10349';
            }
            data = await apiCall(getCategoryEndpoint(), params);
        } else {
            switch (state.filter) {
                case 'movie': data = await apiCall('/discover/movie', getCategoryParams(p)); break;
                case 'tv':    data = await apiCall('/discover/tv', getCategoryParams(p)); break;
                case 'anime': data = await apiCall('/discover/tv', getCategoryParams({ ...p, with_genres: '16' })); break;
                case 'dorama':data = await apiCall('/discover/tv', getCategoryParams(p)); break;
                default:      data = await apiCall('/trending/all/day', p);
            }
        }

        if (data?.results?.length > 0) {
            const items = data.results.filter(i => i.poster_path && isContentAllowed(i));
            if (items.length > 0) {
                state.content = [...state.content, ...items];
                appendItems(items);
            }
            state.hasMore = state.page < data.total_pages;
            state.page++;
            state.error = false;

            // Si todos fueron filtrados y hay más páginas, seguir
            if (items.length === 0 && state.hasMore) {
                state.loading = false;
                return loadContent();
            }
        } else {
            state.hasMore = false;
            if (state.content.length === 0) {
                state.error = true;
                renderError();
            }
        }
    } catch (e) {
        console.error("Error loading content:", e);
        state.error = true;
        if (state.content.length === 0) renderError();
    } finally {
        state.loading = false;
        toggleSkeletons(false);
        updateInfiniteScrollTrigger();
    }
}

            <div id="genreRowsContainer"></div>
            <div class="grid" id="contentGrid"></div>
            <div id="skeletonContainer" class="grid" style="display: none;">
                ${Array(12).fill(0).map(() => createSkeleton()).join('')}
            </div>
            <div id="loadMoreTrigger" style="height:120px; display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--text-muted); gap:12px; transition: opacity 0.3s;">
                <div class="spinner"></div>
                <span class="loading-text" style="font-size:13px; font-weight:500; letter-spacing:0.5px;">CARGANDO MÁS CONTENIDO</span>
            </div>
        </div>
    `, { preserveScroll: true });
    updateActiveNav();
}

function appendItems(items) {
    const grid = document.getElementById('contentGrid');
    if (!grid) return;
    console.debug('[appendItems] inserting items into grid', { count: items.length });
    const html = items.map(item => createCard(item)).join('');
    grid.insertAdjacentHTML('beforeend', html);
    
    const cards = grid.querySelectorAll('.card:not(.visible)');
    cards.forEach((card, i) => {
        setTimeout(() => card.classList.add('visible'), i * 50);
    });
}

function toggleSkeletons(show) {
    const skeletonContainer = document.getElementById('skeletonContainer');
    const trigger = document.getElementById('loadMoreTrigger');
    if (skeletonContainer) skeletonContainer.style.display = show ? 'grid' : 'none';
    if (trigger) trigger.style.opacity = show ? '0' : '1';
}

function renderError() {
    const main = document.getElementById('mainContent');
    if (!main) return;
    safeReplaceMain(`
        <div class="content-area" style="text-align:center; padding:100px 20px;">
            <h2 style="color:var(--text-secondary); margin-bottom:20px;">No se pudo cargar el contenido</h2>
            <button class="back-btn" style="margin:0 auto;" onclick="loadContent(true)">Reintentar Carga</button>
        </div>
    `, { preserveScroll: false });
}

function updateInfiniteScrollTrigger() {
    const trigger = document.getElementById('loadMoreTrigger');
    if (trigger) {
        trigger.style.display = state.hasMore ? 'flex' : 'none';
    }
}

function createCard(item, visible = false) {
    const title = item.title || item.name;
    const type = item.media_type || (item.title ? 'movie' : 'tv');
    const year = (item.release_date || item.first_air_date || '').split('-')[0];
    const rating = item.vote_average ? item.vote_average.toFixed(1) : 'N/A';

    return `
        <div class="card ${visible ? 'visible' : ''}" onclick="goToDetail(${item.id}, '${type}')">
            <div class="card-media">
                <img src="${TMDB_IMG_URL}${item.poster_path}" alt="${title}" loading="lazy">
                <div class="card-badge">★ ${rating}</div>
            </div>
            <div class="card-info">
                <div class="card-title">${title}</div>
                <div class="card-meta">${year} • ${getTypeLabel(type)}</div>
            </div>
        </div>
    `;
}

function createSkeleton() {
    return `<div class="card"><div class="card-media skeleton"></div><div class="card-info"><div class="card-title skeleton" style="height:15px;width:80%;margin-bottom:8px;border-radius:4px;"></div><div class="card-meta skeleton" style="height:12px;width:40%;border-radius:4px;"></div></div></div>`;
}

function renderHome() {
    if (state.view !== 'home') return;
    if (state.content.length > 0) {
        renderHomeFrame();
        appendItems(state.content);
    } else {
        loadContent(true);
    }
}

// ═══ ALLPELÍCULAS: scraping 100% del lado del servidor (scraper propio) ═════════════
// No requiere proxy CORS ni dependencias externas.
// El scraper está desplegado en Render y extrae servidores de allpeliculas.la con Playwright.

const AP_API = 'https://scraper-5634.onrender.com/api/servers';

// Reintentos con backoff exponencial
const RETRY_CONFIG = { maxAttempts: 5, baseDelay: 2000, maxDelay: 15000 };

async function retryFetch(url, opts = {}, attempt = 1) {
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 30000);
  try {
    const res = await fetch(url, { ...opts, signal: controller.signal });
    clearTimeout(timeout);
    if (!res.ok && attempt < RETRY_CONFIG.maxAttempts && (res.status >= 500 || res.status === 429)) {
      const delay = Math.min(RETRY_CONFIG.baseDelay * Math.pow(2, attempt - 1), RETRY_CONFIG.maxDelay);
      console.warn(`[AllPelículas] HTTP ${res.status}, reintento ${attempt}/${RETRY_CONFIG.maxAttempts} en ${delay}ms...`);
      await new Promise(r => setTimeout(r, delay));
      return retryFetch(url, opts, attempt + 1);
    }
    return res;
  } catch (e) {
    clearTimeout(timeout);
    if (attempt < RETRY_CONFIG.maxAttempts && (e.name === 'AbortError' || e.message.includes('fetch'))) {
      const delay = Math.min(RETRY_CONFIG.baseDelay * Math.pow(2, attempt - 1), RETRY_CONFIG.maxDelay);
      console.warn(`[AllPelículas] Error de red, reintento ${attempt}/${RETRY_CONFIG.maxAttempts} en ${delay}ms...`, e.message);
      await new Promise(r => setTimeout(r, delay));
      return retryFetch(url, opts, attempt + 1);
    }
    throw e;
  }
}

function detectServerName(url) {
    try { return new URL(url).hostname.replace('www.', '').replace(/\b\w/g, c => c.toUpperCase()); }
    catch { return 'Servidor'; }
}

async function goToAllpeliculasServer(title) {
    const wrap = document.querySelector('.player-wrapper');
    if (!wrap) return;
    const apContainer = document.getElementById('allpeliculasServers');
    if (apContainer) {
        apContainer.innerHTML = `
            <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;
                        color:var(--text-muted);margin-bottom:8px;padding-top:12px;
                        border-top:1px solid var(--glass-border);">
                ⭐ AllPelículas (HD)
            </div>
            <div class="server-btn active" style="cursor:wait;" id="apSearchStatus">⏳ Buscando… (intento 1/${RETRY_CONFIG.maxAttempts})</div>`;
    }
    wrap.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-muted);flex-direction:column;gap:16px;"><div class="spinner" style="width:40px;height:40px;border-width:3px;"></div><span style="font-size:14px;">Buscando en AllPelículas…</span></div>`;

    try {
        const res = await retryFetch(`${AP_API}?title=${encodeURIComponent(title)}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        // Actualizar contador de reintentos en la UI
        const statusEl = document.getElementById('apSearchStatus');
        if (statusEl) statusEl.textContent = `✅ ${data.servers?.length || 0} servidores encontrados`;

        if (!data.servers?.length) throw new Error('Sin servidores');
        state.allpeliculasServers = data.servers;
        state.allpeliculasActiveIdx = 0;
        renderAllpeliculasServerButtons();
        const first = data.servers[0];
        if (first.url) loadIframe(first.url, wrap);
    } catch (e) {
        console.error('[AllPelículas]', e);
        if (apContainer) {
            apContainer.innerHTML = `
                <div style="font-size:12px;color:var(--text-muted);padding:4px 8px;">
                    ⚠️ Servidor de AllPelículas no disponible<br>
                    <span style="font-size:11px;">
                      Causa probable: el scraper en Render está reiniciándose o durmiendo (plan gratuito se apaga a los 15 min sin uso).<br>
                      📋 <strong>Solución:</strong> recargá la página y esperá 30 segundos a que despierte.
                    </span>
                </div>`;
        }
        wrap.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-muted);flex-direction:column;gap:12px;text-align:center;padding:20px;">
            <p>⚠️ Servidor de AllPelículas no disponible</p>
            <p style="font-size:12px;">Error: ${e.message}</p>
            <p style="font-size:11px;color:var(--text-muted);max-width:320px;">
              El scraper en Render puede estar durmiendo (plan gratuito se apaga a los 15 min sin uso).<br>
              <strong>Recargá la página y esperá 30 segundos.</strong>
            </p>
        </div>`;
    }
}

function loadIframe(src, wrap) {
    wrap.innerHTML = '';
    const iframe = document.createElement('iframe');
    iframe.src = src;
    iframe.allowFullscreen = true;
    iframe.allow = 'autoplay; fullscreen; picture-in-picture; encrypted-media';
    iframe.style.cssText = 'width:100%;height:100%;border:none;';
    wrap.appendChild(iframe);
}

function changeAllpeliculasServer(idx) {
    const srv = state.allpeliculasServers[idx];
    if (!srv || !srv.url) return;
    state.allpeliculasActiveIdx = idx;
    const iframe = document.querySelector('.player-wrapper iframe');
    if (iframe) iframe.src = srv.url;
    renderAllpeliculasServerButtons();
}

function renderAllpeliculasServerButtons() {
    const el = document.getElementById('allpeliculasServers');
    if (!el) return;
    if (!state.allpeliculasServers.length) { el.innerHTML = ''; return; }
    el.innerHTML = `
        <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;
                    color:var(--text-muted);margin-bottom:8px;padding-top:12px;
                    border-top:1px solid var(--glass-border);">⭐ AllPelículas (HD)</div>
        ${state.allpeliculasServers.map((srv, i) =>
            `<button class="server-btn ${state.allpeliculasActiveIdx === i ? 'active' : ''}" onclick="changeAllpeliculasServer(${i})">${srv.type === 'download' ? '⬇' : '▶'} ${srv.name}</button>`
        ).join('')}
    `;
}

async function renderDetail() {
    const main = document.getElementById('mainContent');
    const item = state.currentItem;
    if (!main || !item) return;

    const isMovie = item.title !== undefined;
    const type = isMovie ? 'movie' : 'tv';
    
    // Obtener IMDb ID para los servidores que lo requieren
    let imdbId = null;
    try {
        const externalIds = await apiCall(`/${type}/${item.id}/external_ids`);
        imdbId = externalIds ? externalIds.imdb_id : null;
    } catch (e) { console.error("Error fetching IMDb ID", e); }

    // Definición de Servidores
    // AllPelículas ocupará el índice 0, desplazando los demás
    const allpeliculasEntry = { name: "AllPelículas", url: null, type: "allpeliculas" };

    const embeddedServers = [
        {
            name: "Embed69",
            url: imdbId ? (isMovie 
                ? `https://embed69.org/f/${imdbId}/` 
                : `https://embed69.org/f/${imdbId}-${state.currentSeason}x${state.currentEpisode.toString().padStart(2, '0')}/`) : null
        },
        {
            name: "Videasy (latino)",
            url: isMovie 
                ? `https://player.videasy.net/movie/${item.id}?language=es` 
                : `https://player.videasy.net/tv/${item.id}/${state.currentSeason}/${state.currentEpisode}?language=es`
        },
        {
            name: "UnlimPlay",
            url: isMovie 
                ? `https://unlimplay.com/f/embed/movie/${item.id}` 
                : `https://unlimplay.com/f/embed/tv/${item.id}/${state.currentSeason}/${state.currentEpisode}`
        }
    ];

    // Servidores combinados: AllPelículas primero + servidores embedding
    const servers = [allpeliculasEntry, ...embeddedServers.filter(s => s.url !== null)];

    // Filtrar servidores que no tengan URL, MENOS AllPelículas
    const activeServers = servers.filter(s => s.type === 'allpeliculas' || s.url !== null);
    
    // Asegurar que el servidor actual sea válido
    if (state.currentServer >= activeServers.length) state.currentServer = 0;
    const currentUrl = activeServers[state.currentServer].url;

    safeReplaceMain(`
        <div class="content-area detail-view">
            <button class="back-btn" onclick="goHome()">${icons.back} Volver</button>
            <div class="detail-hero">
                <img src="${TMDB_BACKDROP_URL}${item.backdrop_path}" class="detail-hero-img">
                <div class="detail-hero-content">
                    <h1 class="detail-title">${item.title || item.name}</h1>
                    <div class="detail-meta-row">
                        <span class="meta-item">★ ${item.vote_average.toFixed(1)}</span>
                        <span class="meta-item">${(item.release_date || item.first_air_date || '').split('-')[0]}</span>
                        <span class="meta-item">${getTypeLabel(type)}</span>
                    </div>
                </div>
            </div>
            <div class="detail-grid">
                <div class="detail-main">
                    <div class="player-wrapper">
                        <iframe src="${currentUrl}" allowfullscreen allow="autoplay; fullscreen; picture-in-picture; encrypted-media" frameborder="0"></iframe>
                    </div>
                    <div style="margin-top:32px;">
                        <h2 class="section-title" style="font-size:20px;">Sinopsis</h2>
                        <p style="color:var(--text-secondary);line-height:1.8;">${item.overview || 'Sin descripción disponible.'}</p>
                    </div>
                </div>
                <div class="detail-sidebar">
                    <div class="sidebar-box">
                        <h3 class="box-title">Servidor</h3>
                        <div class="server-list">
                            ${activeServers.map((s, idx) => `
                                <button class="server-btn ${state.currentServer === idx ? 'active' : ''}"
                                    ${s.type === 'allpeliculas'
                                        ? `onclick="goToAllpeliculasServer('${item.title || item.name}'); return false;"`
                                        : `onclick="changeServer(${idx})"`
                                    }>
                                    ${idx === 0 ? '⭐' : idx + 1}. ${s.name}
                                </button>
                            `).join('')}
                        </div>
                        <div id="allpeliculasServers"></div>
                    </div>
                        <!-- Servidores de AllPelículas van aquí, separados -->
                        <div id="allpeliculasServers"></div>
                    </div>
                    ${!isMovie ? `
                        <div class="sidebar-box">
                            <h3 class="box-title">Temporada</h3>
                            <select class="server-btn" style="width:100%;margin-bottom:16px;" onchange="changeSeason(this.value)">
                                ${(item.seasons || []).filter(s => s.season_number > 0).map(s => `
                                    <option value="${s.season_number}" ${state.currentSeason == s.season_number ? 'selected' : ''}>Temporada ${s.season_number}</option>
                                `).join('')}
                            </select>
                            <h3 class="box-title">Episodios</h3>
                            <div class="ep-list" id="epGrid"></div>
                        </div>` : ''}
                </div>
            </div>
        </div>
    `, { preserveScroll: false });
    if (!isMovie) loadEpisodes(item.id, state.currentSeason);
    console.debug('[renderDetail] scrolling to top for detail view');
    window.scrollTo(0,0);
}

async function loadEpisodes(id, s) {
    const data = await apiCall(`/tv/${id}/season/${s}`);
    const grid = document.getElementById('epGrid');
    if (grid && data && data.episodes) {
        grid.innerHTML = data.episodes.map(e => `
            <button class="ep-btn ${state.currentEpisode == e.episode_number ? 'active' : ''}" onclick="changeEpisode(${e.episode_number})">
                ${e.episode_number}
            </button>
        `).join('');
    }
}

async function goToDetail(id, type) {
    const data = await apiCall(`/${type}/${id}`);
    if (data) {
        state.currentItem = data;
        state.view = 'detail';
        state.currentSeason = 1;
        state.currentEpisode = 1;
        state.currentServer = 0;
        renderDetail();
    }
}

function setFilter(t) {
    state.view = 'home';
    state.filter = t;
    state.search = '';
    state.selectedGenre = null;
    state.genreName = '';
    const input = document.getElementById('searchInput');
    if (input) input.value = '';
    window.scrollTo(0, 0);
    loadContent(true, false);
}

function goHome() { 
    state.view = 'home'; 
    window.scrollTo(0, 0);
    renderHome(); 
}
function changeSeason(n) { state.currentSeason = parseInt(n); state.currentEpisode = 1; renderDetail(); }
function changeEpisode(n) { state.currentEpisode = parseInt(n); renderDetail(); }
function changeServer(idx) { state.currentServer = idx; renderDetail(); }

function setupSearch() {
    const input = document.getElementById('searchInput');
    let t;
    if (input) input.addEventListener('input', (e) => {
        clearTimeout(t);
        t = setTimeout(() => {
            state.search = e.target.value;
            state.view = 'home';
            window.scrollTo(0, 0);
            loadContent(true, false);
        }, 500);
    });
}

function setupInfiniteScroll() {
    const observer = new IntersectionObserver((entries) => {
        const entry = entries[0];
        // En Index (1).html la lógica es más simple y directa
        if (entry.isIntersecting && !state.loading && state.hasMore) {
            loadContent();
        }
    }, {
        rootMargin: '100px', // Un poco menos agresivo que 800px para evitar loops
        threshold: 0.1
    });

    const observeTrigger = () => {
        const trigger = document.getElementById('loadMoreTrigger');
        if (trigger) {
            observer.disconnect();
            observer.observe(trigger);
        }
    };

    window.refreshObserver = observeTrigger;
}

// Removed hacky override of renderHomeFrame to avoid re-attaching observer repeatedly.
// Call `window.refreshObserver()` explicitly after rendering where needed.

function getTypeLabel(t) { return { movie: 'Película', tv: 'Serie', anime: 'Anime', dorama: 'Dorama' }[t] || t; }

function updateActiveNav() {
    document.querySelectorAll('.nav-item').forEach(el => {
        el.classList.toggle('active', el.dataset.type === state.filter);
    });
}

document.addEventListener('DOMContentLoaded', () => {
    if ('scrollRestoration' in history) {
        history.scrollRestoration = 'manual';
    }
    loadSensitiveSetting();
    updateSensitiveToggle();
    setupSearch();
    setupInfiniteScroll();
    // Mutation observer to detect unexpected main DOM rebuilds
    try {
        const mainEl = document.getElementById('mainContent');
        if (mainEl) {
            const mo = new MutationObserver((mutations) => {
                for (const m of mutations) {
                    if (m.type === 'childList') {
                        console.warn('[MutationObserver] mainContent childList changed', m);
                        console.trace();
                    } else if (m.type === 'attributes') {
                        console.warn('[MutationObserver] mainContent attributes changed', m.attributeName);
                        console.trace();
                    }
                }
            });
            mo.observe(mainEl, { childList: true, subtree: false, attributes: true });
            window.__mainMutationObserver = mo;
        }
    } catch (e) { console.error('Failed to attach MutationObserver', e); }
    loadContent(true);

    // Verificar estado del scraper de AllPeliculas cada 60 segundos
    checkScraperHealth();
    setInterval(checkScraperHealth, 60000);
});

// ── Health check del scraper de AllPeliculas ───────────────────────
async function checkScraperHealth() {
    const dot = document.getElementById('scraperDot');
    const text = document.getElementById('scraperText');
    if (!dot || !text) return;
    text.textContent = 'AP: comprobando…';
    try {
        const ctrl = new AbortController();
        const timeout = setTimeout(() => ctrl.abort(), 8000);
        const res = await fetch(`${AP_API}?title=test`, { signal: ctrl.signal });
        clearTimeout(timeout);
        if (res.ok) {
            dot.style.background = '#22c55e';
            dot.style.boxShadow = '0 0 8px #22c55e';
            text.textContent = 'AP: online';
            text.style.color = '#22c55e';
            return;
        }
        throw new Error('HTTP ' + res.status);
    } catch (e) {
        dot.style.background = '#ef4444';
        dot.style.boxShadow = '0 0 8px #ef4444';
        text.textContent = 'AP: offline/durmiendo';
        text.style.color = '#ef4444';
    }
}
